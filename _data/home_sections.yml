- id: about
  title: About
  content: |
    I am currently a second-year Ph.D. student at Shanghai Jiao Tong University, supervised by [Wenjun Zeng](https://scholar.google.com/citations?user=_cUfvYQAAAAJ&hl=zh-CN&oi=sra) and [Xin Jin](https://scholar.google.com/citations?hl=zh-CN&user=byaSC-kAAAAJ). Before that, I earned my B.Eng. degree from Dalian University of Technology.

    My research focuses on multimodal language models, particularly streaming and long-video understanding. My long-term goal is to build an always-on personal video assistant with real-time perception, long-term memory, and continuous interaction. I am also interested in unified models and representation compression.

    I am always open to collaboration—feel free to [get in touch](mailto:huangjianguo@sjtu.edu.cn) 😊
