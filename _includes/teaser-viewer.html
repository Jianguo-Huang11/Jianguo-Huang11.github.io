<dialog id="teaser-viewer" class="teaser-viewer" aria-labelledby="teaser-viewer-title">
  <div class="teaser-viewer-header">
    <p id="teaser-viewer-title" class="teaser-viewer-title"></p>
    <button type="button" class="teaser-viewer-close" aria-label="Close enlarged figure" autofocus>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true" focusable="false">
        <path stroke-linecap="round" d="m6 6 12 12M18 6 6 18" />
      </svg>
    </button>
  </div>
  <img class="teaser-viewer-image" alt="">
</dialog>
<script src="{{ '/assets/js/teaser-viewer.js' | relative_url }}?v={{ site.time | date: '%s' }}" defer></script>
