<header class="site-header">
  <div class="site-nav-shell">
    <nav aria-label="Main navigation">
      <ul class="site-nav">
        <li>
          <a href="{{ '/' | relative_url }}" class="text-text-muted no-underline hover:text-text {% if page.url == '/' %}text-text font-bold{% endif %}" {% if page.url == '/' %}aria-current="page"{% endif %}>
            Home
          </a>
        </li>
        {% for section in site.data.home_sections %}
        <li>
          <a href="{{ '/' | relative_url }}#{{ section.id }}" class="text-text-muted no-underline hover:text-text">
            {{ section.title }}
          </a>
        </li>
        {% endfor %}
        <li class="site-nav-secondary">
          <a href="{{ '/cv/' | relative_url }}" class="text-text-muted no-underline hover:text-text {% if page.url == '/cv/' %}text-text font-bold{% endif %}" {% if page.url == '/cv/' %}aria-current="page"{% endif %}>
            CV
          </a>
          <a href="{{ '/blog/' | relative_url }}" class="text-text-muted no-underline hover:text-text {% if page.url contains '/blog' or page.layout == 'post' %}text-text font-bold{% endif %}" {% if page.url contains '/blog' or page.layout == 'post' %}aria-current="page"{% endif %}>
            Blog
          </a>
        </li>
      </ul>
    </nav>
  </div>
</header>
